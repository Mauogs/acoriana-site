<!doctype html>
<html lang="pt-br">
  <!-- Metadados, título e folhas de estilo externas. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho | Açoriana</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsivo.css" />
    <link rel="stylesheet" href="css/carrinho.css" />
  </head>

  <body>
    <!-- Identidade da padaria, navegação e acesso ao carrinho. -->
    <header class="navbar">
      <div class="logo-area">
        <img
          src="assets/logo/logo_padaria_acoriana.png"
          alt="Logo da Açoriana Conveniência"
        >

        <div class="logo-text">
          <strong>AÇORIANA</strong>
          <span>CONVENIÊNCIA / PÃES ESPECIAIS</span>
        </div>
      </div>

      <!-- O menu é recolhido por script.js em telas pequenas. -->
        <nav class="menu" id="menu-principal" aria-label="Navegação principal">
        <a href="index.html#inicio" class="links">Início</a>
        <a href="catalogo.html" class="links">Catálogo</a>
        <a href="index.html#sobre-nos" class="links">Sobre Nós</a>
        <a href="index.html#contato" class="links">Contato</a>
      </nav>

      <!-- Botão acessível: aria-expanded acompanha a abertura do menu. -->
        <button class="menu-toggle" type="button" aria-controls="menu-principal" aria-expanded="false" hidden>Menu</button>
        <div class="acoes">
        <a href="carrinho.html" class="carrinho">
          Carrinho
          <span class="contador">0</span>
        </a>

        <a href="catalogo.html" class="encomenda">
          Fazer Encomenda
        </a>
      </div>
    </header>

    <main class="carrinho-pagina">
      <section class="carrinho-header">
        <span class="tag-tradicao">Seu pedido</span>

        <h1>Carrinho</h1>

        <p>
          Confira os produtos selecionados e revise seu pedido antes de
          finalizar.
        </p>
      </section>

      <section class="carrinho-conteudo">
        <div class="lista-carrinho"></div>

        <!-- Totais calculados em JavaScript com base nos itens persistidos. -->
        <aside class="resumo-carrinho">
          <h2>Resumo do pedido</h2>

          <div class="resumo-linha">
            <span>Subtotal</span>
            <strong>R$ 0,00</strong>
          </div>

          <div class="resumo-linha total">
            <span>Total</span>
            <strong>R$ 0,00</strong>
          </div>

          <button class="btn-finalizar">
            Ver resumo da encomenda
          </button>

          <a href="catalogo.html" class="btn-continuar">
            Continuar comprando
          </a>
        </aside>
      </section>
    </main>

    <!-- JavaScript externo; a ordem garante a disponibilidade das funções compartilhadas. -->
    <script src="js/script.js"></script>
  </body>
</html>
