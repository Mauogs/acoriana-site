<!doctype html>
<html lang="pt-br">
  <!-- Metadados, título e folhas de estilo externas. -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/catalogo.css" />
    <link rel="stylesheet" href="css/responsivo.css" />
  </head>
  <body>
    <!-- Identidade da padaria, navegação e acesso ao carrinho. -->
    <header class="navbar">
      <div class="logo-area">
        <img
          src="assets/logo/logo_padaria_acoriana.png"
          alt="Logo da Açoriana Conveniência"
        />
        <div class="logo-text">
          <strong>AÇORIANA</strong> <span>CONVENIÊNCIA / PÃES ESPECIAIS</span>
        </div>
      </div>
      <!-- O menu é recolhido por script.js em telas pequenas. -->
        <nav class="menu" id="menu-principal" aria-label="Navegação principal">
        <a href="index.html#inicio" class="links">Início</a>
        <a href="catalogo.html" class="links">Catálogo</a>
        <a href="index.html#sobre-nos" class="links">Sobre Nós</a>
        <a href="index.html#contato" class="links">Contato</a>
      </nav>
      <!-- Botão acessível: aria-expanded acompanha a abertura do menu. -->
        <button class="menu-toggle" type="button" aria-controls="menu-principal" aria-expanded="false" hidden>Menu</button>
        <div class="acoes">
        <a href="carrinho.html" class="carrinho">
          Carrinho <span class="contador">0</span>
        </a>
        <a href="catalogo.html" class="encomenda"> Fazer Encomenda </a>
      </div>
    </header>
    <main class="catalogo">
      <section class="catalogo-header">
        <span class="tag-tradicao">Nossos produtos</span>
        <h1>Catálogo</h1>
        <p>
          Confira nossos pães, doces, salgados e outras delícias preparadas
          especialmente para você.
        </p>
      </section>
      <section class="catalogo-filtros">
        <div class="busca">
          <input
            type="search"
            id="campo-busca"
            placeholder="Buscar produto..."
            aria-label="Buscar produto"
          />
        </div>
        <div class="categorias">
            <button class="filtro ativo" data-categoria="Todos">Todos</button>
            <button class="filtro" data-categoria="Pães">Pães</button>
            <button class="filtro" data-categoria="Pães Especiais">Pães Especiais</button>
            <button class="filtro" data-categoria="Doces">Doces</button>
            <button class="filtro" data-categoria="Salgados">Salgados</button>
            <button class="filtro" data-categoria="Bolos">Bolos</button>
            <button class="filtro" data-categoria="Pratos Especiais">Pratos Especiais</button>
        </div>
      </section>
      <!-- Região preenchida pela busca e pelos filtros de categoria. -->
      <p id="resultado-busca" role="status" aria-live="polite"></p>
      <section class="produtos"><div class="lista-produtos"></div></section>
    </main>
    <!-- JavaScript externo; a ordem garante a disponibilidade das funções compartilhadas. -->
    <script src="js/produtos.js"></script>
    <script src="js/script.js"></script>
    <script src="js/catalogo.js"></script>
  </body>
</html>
